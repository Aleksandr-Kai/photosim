<meta charset="utf-8" />
<title>PhotoSim</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
	rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
/>
<link rel="stylesheet" href="styles.css" />

<div class="panel">
	<header>
		<div class="brand">
			<svg width="34" height="34" viewBox="0 0 34 34" fill="none">
				<rect
					x="1"
					y="9"
					width="32"
					height="21"
					rx="4"
					stroke="currentColor"
					stroke-width="1.6"
					fill="none"
					style="color: var(--text)"
				/>
				<rect
					x="10"
					y="4"
					width="10"
					height="6"
					rx="1.5"
					stroke="currentColor"
					stroke-width="1.6"
					fill="none"
					style="color: var(--text)"
				/>
				<circle
					cx="17"
					cy="19.5"
					r="7.2"
					stroke="currentColor"
					stroke-width="1.6"
					fill="none"
					style="color: var(--text)"
				/>
				<circle cx="17" cy="19.5" r="2.6" fill="var(--accent)" />
				<circle
					cx="27"
					cy="13.2"
					r="1.1"
					fill="currentColor"
					style="color: var(--text)"
				/>
			</svg>
			<div>
				<h1>PhotoSim</h1>
				<p data-i18n="subtitle">
					Pick a lens, set your distance, see what stays sharp
				</p>
			</div>
		</div>
	</header>

	<div class="stage">
		<div class="ruler-wrap">
			<svg
				id="scene-svg"
				viewBox="0 0 700 320"
				preserveAspectRatio="xMidYMid meet"
			></svg>
			<div class="drag-hint" data-i18n="dragHint">
				Drag the camera to change its height
			</div>
			<a
				id="author-link"
				class="tg-link"
				href="https://t.me/aleksandr_kai"
				target="_blank"
				rel="noopener noreferrer"
				aria-label="Author on Telegram: @aleksandr_kai"
			>
				<svg
					class="tg-icon"
					width="14"
					height="14"
					viewBox="0 0 24 24"
					fill="none"
				>
					<path
						d="M21.5 4.5L2.7 11.9c-1.2.5-1.2 1.2-.2 1.5l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.8 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.8-1.3-1.2Z"
						fill="none"
						stroke="currentColor"
						stroke-width="1.6"
						stroke-linejoin="round"
					/>
					<path
						d="M8.9 15.3l10.7-8.9-9.1 9.9"
						fill="none"
						stroke="currentColor"
						stroke-width="1.6"
						stroke-linejoin="round"
					/>
				</svg>
				<span class="tg-handle">@aleksandr_kai</span>
			</a>
		</div>
	</div>

	<div class="controls">
		<div class="field field-distance">
			<div class="field-head">
				<span class="fname" data-i18n="subjectDistance">Subject Distance</span>
				<span class="fval num" id="val-distance">–</span>
			</div>
			<input type="range" id="slider-distance" min="0" max="1000" step="1" />
		</div>

		<div class="hud-sliders">
			<div class="field field-focal">
				<div class="field-head">
					<span class="fname" data-i18n="focalLength">Focal Length</span>
					<span class="fval num" id="val-focal">–</span>
				</div>
				<input type="range" id="slider-focal" min="0" max="1" step="1" />
				<div class="tickline" id="tick-focal"></div>
			</div>

			<div class="field field-aperture">
				<div class="field-head">
					<span class="fname" data-i18n="aperture">Aperture</span>
					<span class="fval num" id="val-aperture">–</span>
				</div>
				<input type="range" id="slider-aperture" min="0" max="1" step="1" />
				<div class="tickline" id="tick-aperture"></div>
			</div>
		</div>

		<div class="hud-pills">
			<div class="field field-lens">
				<div class="field-head">
					<span class="fname" data-i18n="lens">Lens</span>
				</div>
				<select id="select-lens"></select>
				<div class="lens-caption" id="lens-caption"></div>
			</div>

			<div class="field field-sensor">
				<div class="field-head">
					<span class="fname" data-i18n="sensor">Sensor</span>
				</div>
				<select id="select-sensor"></select>
			</div>

			<div class="field field-subject">
				<div class="field-head">
					<span class="fname" data-i18n="subject">Subject</span>
				</div>
				<select id="select-subject"></select>
			</div>
		</div>
	</div>

	<footer>
		<span data-i18n="footer"
			>Circle of confusion derived from sensor diagonal · f-stops snap to standard
			full stops for the selected lens</span
		>
	</footer>
</div>

<script src="script.js"></script>
